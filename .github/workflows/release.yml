name: Release WASM

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install binaryen (wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen

      - name: Build self-contained tts.wasm & run full test suite
        run: |
          cargo test --release
          node tools/build_wasm.mjs
          node tests/smoke.mjs

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" pkg/tts.wasm pkg/tts.js pkg/tts.d.ts --clobber
          else
            gh release create "$TAG" pkg/tts.wasm pkg/tts.js pkg/tts.d.ts \
              --title "TTS ${TAG} — Self-Contained WebAssembly Release" \
              --generate-notes
          fi
